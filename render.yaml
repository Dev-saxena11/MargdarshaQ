services:
  - type: web
    name: sih26137-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "*"
        # Replace "*" with your deployed frontend origin(s), comma-separated,
        # e.g. "https://sih26137.vercel.app" — set this in the Render
        # dashboard (Environment tab) once the frontend URL is known.
        # See DEPLOYMENT.md.
